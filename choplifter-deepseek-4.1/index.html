<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f1a" />
    <title>CHOPLIFTER — Web Clone</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05070d;
        color: #cfe3ff;
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        box-shadow: 0 0 0 1px #1d2b45, 0 24px 80px rgba(0, 0, 0, 0.7);
      }

      /* Touch controls: hidden on pointer-fine devices, shown for touch. */
      #touch {
        position: fixed;
        inset: auto 0 0 0;
        display: none;
        justify-content: space-between;
        align-items: flex-end;
        padding: 14px;
        padding-bottom: max(14px, env(safe-area-inset-bottom));
        pointer-events: none;
        z-index: 10;
      }
      body.touch #touch {
        display: flex;
      }
      #touch .cluster {
        display: grid;
        gap: 8px;
        pointer-events: auto;
      }
      #touch .dpad {
        grid-template-columns: repeat(3, 58px);
        grid-template-rows: repeat(2, 58px);
      }
      #touch .dpad .up {
        grid-column: 2;
        grid-row: 1;
      }
      #touch .dpad .left {
        grid-column: 1;
        grid-row: 2;
      }
      #touch .dpad .down {
        grid-column: 2;
        grid-row: 2;
      }
      #touch .dpad .right {
        grid-column: 3;
        grid-row: 2;
      }
      #touch .actions {
        grid-template-columns: repeat(2, 66px);
        grid-template-rows: repeat(2, 66px);
        align-items: end;
      }
      #touch button {
        appearance: none;
        border: 1px solid #2f4a78;
        background: rgba(20, 32, 54, 0.72);
        color: #dceaff;
        border-radius: 14px;
        font: inherit;
        font-size: 18px;
        font-weight: 700;
        width: 100%;
        height: 100%;
        touch-action: none;
        backdrop-filter: blur(3px);
      }
      #touch button.active {
        background: rgba(90, 150, 240, 0.65);
        border-color: #8cc2ff;
      }
      #touch .fire {
        grid-column: 2;
        grid-row: 2;
        background: rgba(120, 30, 40, 0.72);
        border-color: #a33;
      }
      #touch .rotate {
        grid-column: 2;
        grid-row: 1;
        background: rgba(60, 60, 30, 0.72);
        border-color: #a96;
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="game"></div></div>

    <div id="touch" aria-hidden="true">
      <div class="cluster dpad">
        <button class="up" data-act="up" aria-label="Thrust up">▲</button>
        <button class="left" data-act="left" aria-label="Move left">◀</button>
        <button class="down" data-act="down" aria-label="Descend">▼</button>
        <button class="right" data-act="right" aria-label="Move right">▶</button>
      </div>
      <div class="cluster actions">
        <button class="rotate" data-act="rotate" aria-label="Rotate">⟳</button>
        <button class="fire" data-act="fire" aria-label="Fire">FIRE</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
