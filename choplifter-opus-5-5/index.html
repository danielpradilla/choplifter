<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choplifter '82</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  :root { color-scheme: dark; --bg: #05060b; --ink: #a9b3c9; --dim: #5b6478; --key: #14cffd; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); box-sizing: border-box;
    display: flex; flex-direction: column; padding-inline: 16px;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #game { flex: 1; min-height: 0; }
  #game canvas { image-rendering: pixelated; }
  footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; padding-block: 10px 14px; }
  kbd { font: inherit; color: var(--key); border: 1px solid #1d2a3d; padding: 0 5px; }
  footer .credit { color: var(--dim); flex-basis: 100%; text-align: center; }
</style>
</head>
<body>
<div id="game"></div>
<footer>
  <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> fly</span>
  <span><kbd>Z</kbd>/<kbd>Space</kbd> fire</span>
  <span><kbd>X</kbd>/<kbd>Shift</kbd> tap: face front for tanks · hold: reverse</span>
  <span><kbd>P</kbd> pause · <kbd>M</kbd> sound</span>
  <span class="credit">A tribute to Dan Gorlin's Choplifter (Brøderbund, Apple II, 1982). Gamepad works too.</span>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/4.2.1/phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
